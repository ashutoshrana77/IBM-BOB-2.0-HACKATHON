# =============================================================================
# PR Pilot — GitHub Actions Workflow
# Triggers on pull_request events and runs the PR Pilot review.
# =============================================================================

name: PR Pilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: number

# Prevent concurrent runs on the same PR (cancel previous run if new commit pushed)
concurrency:
  group: pr-pilot-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # Required to post PR comments
  issues: write          # Required for issue comment API

jobs:
  pr-pilot-review:
    name: PR Pilot Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout with full history (required for git diff)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.pull_request.base.sha }}
          fetch-depth: 0   # Full history needed for git diff between base and head

      # -----------------------------------------------------------------------
      # 2. Set up Node.js (Bob Shell 2 requires Node.js 24 or later)
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # -----------------------------------------------------------------------
      # 3. Verify the required inference credential before doing any setup
      # -----------------------------------------------------------------------
      - name: Check Bob API key
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: |
          if [ -z "$BOB_API_KEY" ]; then
            echo "::error::Repository secret BOB_API_KEY is missing. Add an IBM Bob API key with Inference scope under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 4. Install Bob Shell using IBM's official installer (not an npm registry package)
      # -----------------------------------------------------------------------
      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --package-manager npm

      # -----------------------------------------------------------------------
      # 5. Verify Bob Shell installation
      # -----------------------------------------------------------------------
      - name: Verify Bob Shell
        run: bob --version

      # -----------------------------------------------------------------------
      # 6. Make scripts executable
      # -----------------------------------------------------------------------
      - name: Make scripts executable
        run: |
          chmod +x ./scripts/review.sh
          chmod +x ./scripts/post-comment.sh

      # -----------------------------------------------------------------------
      # 7. Extract PR metadata
      # -----------------------------------------------------------------------
      - name: Extract PR metadata
        id: pr-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            PR_JSON=$(gh api "repos/$REPOSITORY/pulls/$INPUT_PR_NUMBER")
            echo "pr_number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(echo "$PR_JSON" | jq -r '.base.sha')" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          fi

      # Fetch only the PR's git object; never check out or execute PR code.
      - name: Fetch pull request diff commit
        env:
          PR_NUMBER: ${{ steps.pr-meta.outputs.pr_number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      # -----------------------------------------------------------------------
      # 8. Run PR Pilot review
      # -----------------------------------------------------------------------
      - name: Run PR Pilot Review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          PR_PILOT_DEBUG: "0"
        run: |
          ./scripts/review.sh \
            "${{ steps.pr-meta.outputs.pr_number }}" \
            "${{ steps.pr-meta.outputs.base_sha }}" \
            "${{ steps.pr-meta.outputs.head_sha }}"

      # -----------------------------------------------------------------------
      # 9. Upload review artifact (for debugging / audit trail)
      # -----------------------------------------------------------------------
      - name: Upload review artifact
        if: always() && steps.pr-meta.outputs.pr_number != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-pilot-review-${{ steps.pr-meta.outputs.pr_number }}
          path: .pr-pilot-work/review-${{ steps.pr-meta.outputs.pr_number }}.md
          retention-days: 30
